<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק ניחוש המספר</title>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%);
            overflow: hidden;
            color: #fff;
        }

        .glass-card {
            position: relative;
            width: 380px;
            padding: 40px 30px;
            background: rgba(16, 30, 54, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.125);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        inset 0 0 15px rgba(255, 255, 255, 0.05);
            text-align: center;
            z-index: 2;
        }

        h1 {
            font-weight: 800;
            font-size: 1.8rem;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #64ffda, #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            font-size: 0.85rem;
            color: #8892b0;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        input:focus {
            border-color: #64ffda;
            box-shadow: 0 0 15px rgba(100, 255, 218, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #0077b6, #00b4d8);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 180, 216, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 180, 216, 0.4);
        }

        .result-container {
            margin-top: 25px;
            min-height: 50px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shatter-num {
            position: absolute;
            font-size: 3rem;
            font-weight: 800;
            color: #64ffda;
            opacity: 1;
            z-index: 5;
            pointer-events: none;
        }

        .shatter-num.shatter {
            animation: shatterAnim 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes shatterAnim {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: blur(0px); }
            50% { transform: scale(1.4) rotate(5deg); filter: blur(2px); }
            100% { transform: scale(2) rotate(-15deg); opacity: 0; filter: blur(12px); }
        }

        .message {
            font-size: 1.2rem;
            font-weight: 600;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.5s ease;
        }

        .message.show { opacity: 1; transform: translateY(0); }
        .message.wrong { color: #ff4d6d; text-shadow: 0 0 10px rgba(255, 77, 109, 0.4); }
        .message.win { color: #64ffda; text-shadow: 0 0 10px rgba(100, 255, 218, 0.4); }
        .message.error { color: #ffb703; }

        .shard {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(100, 255, 218, 0.8);
            border-radius: 2px;
            pointer-events: none;
            z-index: 6;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>משחק הניחושים</h1>

        <div class="input-group">
            <label for="username">שם השחקן</label>
            <input type="text" id="username" placeholder="הכנס את שמך" value="שחקן">
        </div>

        <div class="input-group">
            <label for="guessNum">הניחוש שלך (1-100)</label>
            <input type="number" id="guessNum" placeholder="הכנס מספר">
        </div>

        <button class="btn-submit" onclick="makeGuess()">שלח ניחוש</button>

        <div class="result-container" id="resultBox">
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        async function makeGuess() {
            const name = document.getElementById("username").value.trim() || "שחקן";
            const num = document.getElementById("guessNum").value.trim();
            const resultBox = document.getElementById("resultBox");
            const messageEl = document.getElementById("message");

            if (!num) return;

            messageEl.className = "message";
            messageEl.textContent = "";

            const shatterEl = document.createElement("div");
            shatterEl.className = "shatter-num";
            shatterEl.textContent = num;
            resultBox.appendChild(shatterEl);

            createGlassShards(resultBox);

            setTimeout(() => {
                shatterEl.classList.add("shatter");
            }, 50);

            try {
                // פנייה בנתיב יחסי לשרת
                const response = await fetch(`/game/${encodeURIComponent(name)}/${encodeURIComponent(num)}`);

                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }

                const responseText = await response.text();

                setTimeout(() => {
                    shatterEl.remove();
                    messageEl.textContent = responseText;

                    if (responseText.includes("win")) {
                        messageEl.classList.add("show", "win");
                    } else if (responseText.includes("sorry")) {
                        messageEl.classList.add("show", "error");
                    } else {
                        messageEl.classList.add("show", "wrong");
                    }
                }, 400);

            } catch (err) {
                setTimeout(() => {
                    shatterEl.remove();
                    messageEl.textContent = "מתחבר לשרת... נסה שוב בעוד כמה שניות";
                    messageEl.classList.add("show", "error");
                }, 400);
            }
        }

        function createGlassShards(parent) {
            for (let i = 0; i < 12; i++) {
                const shard = document.createElement("div");
                shard.className = "shard";
                const angle = Math.random() * Math.PI * 2;
                const dist = 40 + Math.random() * 60;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                shard.style.transition = "all 0.5s ease-out";
                parent.appendChild(shard);

                setTimeout(() => {
                    shard.style.transform = `translate(${x}px, ${y}px) rotate(${Math.random() * 360}deg) scale(0)`;
                    shard.style.opacity = "0";
                }, 50);

                setTimeout(() => shard.remove(), 550);
            }
        }
    </script>
</body>
</html>
